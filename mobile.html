<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Space Defender - Pro</title>
  <style>
    * { box-sizing: border-box; touch-action: none; user-select: none; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05050d; font-family: sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    });

    let score = 0;
    let gameOver = false;
    let lastShot = 0;
    let fireRate = 220; 
    let powerLevel = 1; // 1 = تک‌تیر, 2 = دوتایی, 3 = سه‌تایی
    let powerTimer = 0;
    let hasShield = false;

    const player = { x: W / 2, y: H - 120, r: 24, targetX: W / 2, targetY: H - 120 };
    const bullets = [];
    const enemies = [];
    const particles = [];
    const powerups = [];

    // لمس صفحه برای کنترل
    window.addEventListener('touchmove', (e) => {
      if (gameOver) return;
      const t = e.touches[0];
      player.targetX = t.clientX;
      player.targetY = t.clientY - 40;
    });

    window.addEventListener('touchstart', (e) => {
      if (gameOver) {
        resetGame();
        return;
      }
      const t = e.touches[0];
      player.targetX = t.clientX;
      player.targetY = t.clientY - 40;
    });

    function resetGame() {
      score = 0;
      powerLevel = 1;
      powerTimer = 0;
      fireRate = 220;
      hasShield = false;
      player.x = W / 2;
      player.y = H - 120;
      player.targetX = player.x;
      player.targetY = player.y;
      bullets.length = 0;
      enemies.length = 0;
      particles.length = 0;
      powerups.length = 0;
      gameOver = false;
    }

    function createParticles(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          r: Math.random() * 3 + 1,
          color,
          alpha: 1
        });
      }
    }

    function spawnEnemy() {
      if (gameOver) return;
      const r = Math.random() * 14 + 14;
      // افزایش تدریجی سرعت دشمن‌ها بر اساس امتیاز
      const speed = 2.5 + Math.min(score / 500, 6);
      enemies.push({
        x: Math.random() * (W - r * 2) + r,
        y: -r,
        r,
        speed,
        color: `hsl(${Math.random() * 60 + 340}, 90%, 60%)`
      });
    }

    function spawnPowerUp(x, y) {
      const types = ['multi', 'rapid', 'shield'];
      const type = types[Math.floor(Math.random() * types.length)];
      powerups.push({ x, y, type, r: 16, vy: 2 });
    }

    let enemyTimer = 0;

    function update(time) {
      // شلیک خودکار
      if (!gameOver && time - lastShot > fireRate) {
        lastShot = time;
        if (powerLevel === 1) {
          bullets.push({ x: player.x, y: player.y - player.r, vy: -12 });
        } else if (powerLevel === 2) {
          bullets.push({ x: player.x - 12, y: player.y - player.r, vy: -12 });
          bullets.push({ x: player.x + 12, y: player.y - player.r, vy: -12 });
        } else {
          bullets.push({ x: player.x, y: player.y - player.r, vy: -12, vx: 0 });
          bullets.push({ x: player.x - 14, y: player.y - player.r, vy: -11, vx: -2 });
          bullets.push({ x: player.x + 14, y: player.y - player.r, vy: -11, vx: 2 });
        }
      }

      // حرکت نرم سفینه به سمت انگشت
      player.x += (player.targetX - player.x) * 0.2;
      player.y += (player.targetY - player.y) * 0.2;

      // مدیریت زمان انقضای پاورآپ
      if (powerTimer > 0) {
        powerTimer--;
        if (powerTimer <= 0) {
          powerLevel = 1;
          fireRate = 220;
        }
      }

      // تولید دشمن بر اساس امتیاز
      enemyTimer++;
      const spawnInterval = Math.max(18, 55 - Math.floor(score / 200));
      if (enemyTimer > spawnInterval) {
        spawnEnemy();
        enemyTimer = 0;
      }

      // گلوله‌ها
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y += b.vy;
        if (b.vx) b.x += b.vx;
        if (b.y < -20) bullets.splice(i, 1);
      }

      // پاورآپ‌ها
      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += p.vy;
        const d = Math.hypot(p.x - player.x, p.y - player.y);
        if (d < p.r + player.r) {
          if (p.type === 'multi') { powerLevel = 3; powerTimer = 450; }
          if (p.type === 'rapid') { fireRate = 100; powerTimer = 450; }
          if (p.type === 'shield') { hasShield = true; }
          createParticles(p.x, p.y, '#00ffcc', 20);
          powerups.splice(i, 1);
          continue;
        }
        if (p.y > H + 40) powerups.splice(i, 1);
      }

      // دشمن‌ها و برخوردها
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed;

        // برخورد گلوله با دشمن
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 6) {
            createParticles(e.x, e.y, e.color, 16);
            score += 20;

            // شانس ۱۵ درصدی افتادن پاورآپ
            if (Math.random() < 0.15) spawnPowerUp(e.x, e.y);

            enemies.splice(i, 1);
            bullets.splice(j, 1);
            break;
          }
        }

        // برخورد دشمن با بازیکن
        if (e && Math.hypot(e.x - player.x, e.y - player.y) < e.r + player.r) {
          if (hasShield) {
            hasShield = false;
            createParticles(player.x, player.y, '#00ffff', 25);
            enemies.splice(i, 1);
          } else {
            gameOver = true;
            createParticles(player.x, player.y, '#ff4444', 35);
          }
        }

        if (e && e.y > H + 50) enemies.splice(i, 1);
      }

      // پارتیکل‌ها
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.025;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.fillStyle = '#05050d';
      ctx.fillRect(0, 0, W, H);

      // گلوله‌ها
      ctx.fillStyle = '#00ffff';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00ffff';
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });

      // پاورآپ‌ها
      powerups.forEach(p => {
        ctx.shadowBlur = 15;
        ctx.shadowColor = p.type === 'shield' ? '#00e5ff' : '#ffeb3b';
        ctx.fillStyle = ctx.shadowColor;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.type === 'shield' ? '🛡️' : '⚡', p.x, p.y);
      });

      // سفینه
      if (!gameOver) {
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#00e5ff';
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - player.r);
        ctx.lineTo(player.x - player.r, player.y + player.r);
        ctx.lineTo(player.x, player.y + player.r * 0.5);
        ctx.lineTo(player.x + player.r, player.y + player.r);
        ctx.closePath();
        ctx.fill();

        // رسم سپر اگر فعال باشد
        if (hasShield) {
          ctx.strokeStyle = '#00ffff';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(player.x, player.y, player.r + 14, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      // دشمن‌ها
      enemies.forEach(e => {
        ctx.shadowBlur = 12;
        ctx.shadowColor = e.color;
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // پارتیکل‌ها
      particles.forEach(p => {
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

      // امتیاز و وضعیت
      ctx.fillStyle = '#fff';
      ctx.font = '18px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`Score: ${score}`, 20, 45);

      if (powerTimer > 0) {
        ctx.fillStyle = '#ffeb3b';
        ctx.font = '14px sans-serif';
        ctx.fillText(`Boost: ${Math.ceil(powerTimer / 60)}s`, 20, 72);
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ff3366';
        ctx.font = 'bold 34px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W / 2, H / 2 - 20);
        ctx.fillStyle = '#fff';
        ctx.font = '18px sans-serif';
        ctx.fillText(`Final Score: ${score}`, W / 2, H / 2 + 25);
        ctx.fillStyle = '#00e5ff';
        ctx.font = '15px sans-serif';
        ctx.fillText('برای بازی دوباره لمس کنید', W / 2, H / 2 + 75);
      }
    }

    function loop(time) {
      update(time);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
