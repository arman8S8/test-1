<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Space Defender - Global Leaderboard</title>
  <style>
    * { box-sizing: border-box; touch-action: none; user-select: none; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05050d; font-family: sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* پنجره ثبت نام و لیدربورد آنلاین */
    #leaderboard-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      max-width: 320px;
      background: rgba(10, 15, 30, 0.95);
      border: 2px solid #00ffff;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.4);
      padding: 16px;
      color: #fff;
      text-align: center;
      z-index: 100;
    }
    #leaderboard-modal h2 { margin: 0 0 10px; color: #ff0055; font-size: 20px; }
    #leaderboard-modal p { margin: 4px 0; font-size: 14px; }
    #player-name-input {
      width: 100%;
      padding: 10px;
      margin: 12px 0;
      border: 1px solid #00e5ff;
      border-radius: 6px;
      background: #050814;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
      touch-action: auto;
      user-select: auto;
    }
    .btn {
      background: #00ffff;
      color: #05050d;
      border: none;
      padding: 10px 18px;
      font-weight: bold;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 8px;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid #555;
      color: #aaa;
    }
    #scores-list {
      margin-top: 10px;
      text-align: left;
      font-size: 13px;
      max-height: 120px;
      overflow-y: auto;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 8px;
    }
    .score-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      color: #ddd;
    }
    .score-row span:last-child { color: #ffeb3b; font-weight: bold; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="leaderboard-modal">
    <h2 id="modal-title">ثبت رکورد جدید</h2>
    <p>امتیاز شما: <span id="final-score-val" style="color:#00ffff; font-weight:bold;">0</span></p>
    <div id="submit-section">
      <input type="text" id="player-name-input" maxlength="12" placeholder="نام خود را بنویسید">
      <button class="btn" id="btn-submit">ثبت در جدول جهانی</button>
    </div>
    <button class="btn btn-secondary" id="btn-restart">شروع بازی مجدد</button>
    <div id="scores-list">
      <div style="text-align:center; color:#888;">در حال دریافت برترین‌ها...</div>
    </div>
  </div>

  <!-- اسکریپت ماژول فایربیس -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcmnZIxNGkPBj8j-grP5flgjrebXgi-hI",
      authDomain: "space-defender-game.firebaseapp.com",
      projectId: "space-defender-game",
      storageBucket: "space-defender-game.firebasestorage.app",
      messagingSenderId: "902447254764",
      appId: "1:902447254764:web:ee83267fc9571c34ed69c9",
      measurementId: "G-V5MBY3SVSW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const modal = document.getElementById('leaderboard-modal');
    const finalScoreVal = document.getElementById('final-score-val');
    const nameInput = document.getElementById('player-name-input');
    const submitBtn = document.getElementById('btn-submit');
    const restartBtn = document.getElementById('btn-restart');
    const scoresList = document.getElementById('scores-list');
    const submitSection = document.getElementById('submit-section');

    async function loadTopScores() {
      scoresList.innerHTML = '<div style="text-align:center; color:#888;">در حال دریافت...</div>';
      try {
        const q = query(collection(db, "scores"), orderBy("score", "desc"), limit(5));
        const snap = await getDocs(q);
        scoresList.innerHTML = '';
        let rank = 1;
        snap.forEach(doc => {
          const d = doc.data();
          const row = document.createElement('div');
          row.className = 'score-row';
          row.innerHTML = `<span>#${rank} ${d.name}</span><span>${d.score}</span>`;
          scoresList.appendChild(row);
          rank++;
        });
        if (rank === 1) scoresList.innerHTML = '<div style="text-align:center; color:#777;">هنوز رکوردی ثبت نشده!</div>';
      } catch (e) {
        scoresList.innerHTML = '<div style="text-align:center; color:#ff4444;">خطا در دریافت جدول</div>';
      }
    }

    submitBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const name = nameInput.value.trim() || 'خلبان گمنام';
      submitBtn.disabled = true;
      submitBtn.innerText = 'در حال ثبت...';
      try {
        await addDoc(collection(db, "scores"), {
          name: name,
          score: window.latestGameScore || 0,
          date: new Date()
        });
        submitSection.style.display = 'none';
        await loadTopScores();
      } catch (err) {
        alert('خطا در ثبت رکورد');
        submitBtn.disabled = false;
        submitBtn.innerText = 'ثبت در جدول جهانی';
      }
    });

    restartBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      modal.style.display = 'none';
      if (window.onRestartGame) window.onRestartGame();
    });

    window.showLeaderboardModal = function(score) {
      window.latestGameScore = score;
      finalScoreVal.innerText = score;
      submitSection.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.innerText = 'ثبت در جدول جهانی';
      modal.style.display = 'block';
      loadTopScores();
    };
  </script>

  <!-- اسکریپت موتور بازی -->
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    });

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'shoot') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(650, now);
          osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'hit') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(40, now + 0.12);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'powerup') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.18);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.18);
        } else if (type === 'alarm') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(880, now + 0.1);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'bossExplode') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(20, now + 0.5);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
          osc.start(now);
          osc.stop(now + 0.5);
        }
      } catch (e) {}
    }

    function vibrate(ms) {
      if (navigator.vibrate) {
        try { navigator.vibrate(ms); } catch (e) {}
      }
    }

    let score = 0;
    let gameOver = false;
    let gameWon = false;
    let modalShown = false;
    let lastShot = 0;
    let baseFireRate = 220;
    let fireRate = baseFireRate; 
    let powerLevel = 1;
    let powerTimer = 0;
    
    let shields = 1; 
    const maxShields = 3;

    const player = { x: W / 2, y: H - 120, r: 24, targetX: W / 2, targetY: H - 120 };
    const bullets = [];
    const bossBullets = [];
    const enemies = [];
    const particles = [];
    const powerups = [];
    const floatingTexts = [];

    let boss = null;
    let bossSpawned2000 = false;
    let bossSpawned5000 = false;
    let bossSpawned10000 = false;
    let bossWarningTimer = 0;
    let spiralAngle = 0;

    window.addEventListener('touchmove', (e) => {
      if (gameOver || gameWon) return;
      const t = e.touches[0];
      player.targetX = t.clientX;
      player.targetY = t.clientY - 40;
    });

    window.addEventListener('touchstart', (e) => {
      initAudio();
      if (gameOver || gameWon) return;
      const t = e.touches[0];
      player.targetX = t.clientX;
      player.targetY = t.clientY - 40;
    });

    window.onRestartGame = function() {
      resetGame();
    };

    function resetGame() {
      score = 0;
      powerLevel = 1;
      powerTimer = 0;
      baseFireRate = 220;
      fireRate = baseFireRate;
      shields = 1;
      boss = null;
      bossSpawned2000 = false;
      bossSpawned5000 = false;
      bossSpawned10000 = false;
      bossWarningTimer = 0;
      spiralAngle = 0;
      modalShown = false;
      player.x = W / 2;
      player.y = H - 120;
      player.targetX = player.x;
      player.targetY = player.y;
      bullets.length = 0;
      bossBullets.length = 0;
      enemies.length = 0;
      particles.length = 0;
      powerups.length = 0;
      floatingTexts.length = 0;
      gameOver = false;
      gameWon = false;
    }

    function createParticles(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          r: Math.random() * 3 + 1,
          color,
          alpha: 1
        });
      }
    }

    function addFloatingText(text, x, y, color = '#ff3344') {
      floatingTexts.push({ text, x, y, alpha: 1, vy: -1.5 });
    }

    function spawnEnemy() {
      if (gameOver || boss) return;
      const r = Math.random() * 14 + 14;
      const speed = 2.5 + Math.min(score / 500, 6);
      enemies.push({
        x: Math.random() * (W - r * 2) + r,
        y: -r,
        r,
        speed,
        color: `hsl(${Math.random() * 60 + 340}, 90%, 60%)`
      });
    }

    function spawnPowerUp(x, y) {
      const types = ['multi', 'rapid', 'shield'];
      const type = types[Math.floor(Math.random() * types.length)];
      powerups.push({ x, y, type, r: 16, vy: 2 });
    }

    function spawnBoss(tier) {
      bossWarningTimer = 110;
      playSound('alarm');
      vibrate(250);

      if (tier === 1) {
        boss = {
          tier: 1,
          name: "VANGUARD DESTROYER",
          x: W / 2, y: -80, targetY: 100,
          r: 44, hp: 65, maxHp: 65, vx: 3.2,
          lastShoot: 0, shootInterval: 750,
          color: '#ff0055'
        };
      } else if (tier === 2) {
        boss = {
          tier: 2,
          name: "CRIMSON TITAN",
          x: W / 2, y: -90, targetY: 120,
          r: 54, hp: 120, maxHp: 120, vx: 4,
          lastShoot: 0, shootInterval: 600,
          color: '#ff6600'
        };
      } else if (tier === 3) {
        boss = {
          tier: 3,
          name: "VOID LEVIATHAN (FINAL BOSS)",
          x: W / 2, y: -110, targetY: 130,
          r: 65, hp: 220, maxHp: 220, vx: 2.5,
          lastShoot: 0, shootInterval: 250,
          color: '#cc00ff'
        };
      }
    }

    let enemyTimer = 0;

    function update(time) {
      if ((gameOver || gameWon) && !modalShown) {
        modalShown = true;
        if (window.showLeaderboardModal) window.showLeaderboardModal(score);
        return;
      }

      if (score >= 2000 && !bossSpawned2000 && !boss) {
        bossSpawned2000 = true;
        spawnBoss(1);
      } else if (score >= 5000 && !bossSpawned5000 && !boss) {
        bossSpawned5000 = true;
        spawnBoss(2);
      } else if (score >= 10000 && !bossSpawned10000 && !boss) {
        bossSpawned10000 = true;
        spawnBoss(3);
      }

      const currentRate = (powerTimer > 0 && fireRate < baseFireRate) ? fireRate : baseFireRate;
      if (!gameOver && !gameWon && time - lastShot > currentRate) {
        lastShot = time;
        playSound('shoot');
        if (powerLevel === 1) {
          bullets.push({ x: player.x, y: player.y - player.r, vy: -12 });
        } else if (powerLevel === 2) {
          bullets.push({ x: player.x - 12, y: player.y - player.r, vy: -12 });
          bullets.push({ x: player.x + 12, y: player.y - player.r, vy: -12 });
        } else {
          bullets.push({ x: player.x, y: player.y - player.r, vy: -12, vx: 0 });
          bullets.push({ x: player.x - 14, y: player.y - player.r, vy: -11, vx: -2 });
          bullets.push({ x: player.x + 14, y: player.y - player.r, vy: -11, vx: 2 });
        }
      }

      player.x += (player.targetX - player.x) * 0.2;
      player.y += (player.targetY - player.y) * 0.2;

      if (powerTimer > 0) {
        powerTimer--;
        if (powerTimer <= 0) {
          powerLevel = 1;
          fireRate = baseFireRate;
        }
      }

      if (!boss) {
        enemyTimer++;
        const spawnInterval = Math.max(16, 55 - Math.floor(score / 200));
        if (enemyTimer > spawnInterval) {
          spawnEnemy();
          enemyTimer = 0;
        }
      }

      if (boss) {
        if (boss.y < boss.targetY) boss.y += 2;
        boss.x += boss.vx;
        if (boss.x + boss.r > W - 15 || boss.x - boss.r < 15) {
          boss.vx *= -1;
        }

        if (time - boss.lastShoot > boss.shootInterval) {
          boss.lastShoot = time;
          if (boss.tier === 1) {
            bossBullets.push({ x: boss.x, y: boss.y + boss.r, vy: 5, r: 6 });
            bossBullets.push({ x: boss.x - 20, y: boss.y + boss.r, vy: 4.5, vx: -1.5, r: 5 });
            bossBullets.push({ x: boss.x + 20, y: boss.y + boss.r, vy: 4.5, vx: 1.5, r: 5 });
          } else if (boss.tier === 2) {
            for (let a = -2; a <= 2; a++) {
              bossBullets.push({ x: boss.x + (a * 10), y: boss.y + boss.r, vy: 4.8, vx: a * 1.4, r: 6 });
            }
          } else if (boss.tier === 3) {
            spiralAngle += 0.55;
            const bvx = Math.cos(spiralAngle) * 4.5;
            const bvy = Math.sin(spiralAngle) * 4.5 + 1.5;
            bossBullets.push({ x: boss.x, y: boss.y + boss.r, vx: bvx, vy: bvy, r: 6 });
            bossBullets.push({ x: boss.x, y: boss.y + boss.r, vx: -bvx, vy: bvy, r: 6 });
          }
        }
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y += b.vy;
        if (b.vx) b.x += b.vx;

        if (boss && Math.hypot(b.x - boss.x, b.y - boss.y) < boss.r + 6) {
          boss.hp--;
          createParticles(b.x, b.y, boss.color, 4);
          bullets.splice(i, 1);

          if (boss.hp <= 0) {
            playSound('bossExplode');
            vibrate([100, 50, 200]);
            createParticles(boss.x, boss.y, boss.color, 50);
            createParticles(boss.x, boss.y, '#00ffff', 50);
            score += boss.tier * 1500;
            baseFireRate = Math.max(90, baseFireRate - 35);
            addFloatingText("SPEED UPGRADED!", boss.x, boss.y - 20, '#00ffcc');
            spawnPowerUp(boss.x, boss.y);
            spawnPowerUp(boss.x - 30, boss.y);
            spawnPowerUp(boss.x + 30, boss.y);

            if (boss.tier === 3) gameWon = true;
            boss = null;
          }
          continue;
        }

        if (b.y < -20) bullets.splice(i, 1);
      }

      for (let i = bossBullets.length - 1; i >= 0; i--) {
        const bb = bossBullets[i];
        bb.y += bb.vy;
        if (bb.vx) bb.x += bb.vx;

        if (Math.hypot(bb.x - player.x, bb.y - player.y) < bb.r + player.r) {
          bossBullets.splice(i, 1);
          if (shields > 0) {
            shields--;
            playSound('hit');
            vibrate(120);
            createParticles(player.x, player.y, '#00ffff', 25);
          } else {
            gameOver = true;
            playSound('hit');
            vibrate(400);
            createParticles(player.x, player.y, '#ff4444', 35);
          }
          continue;
        }

        if (bb.y > H + 30 || bb.y < -30 || bb.x < -30 || bb.x > W + 30) bossBullets.splice(i, 1);
      }

      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += p.vy;
        const d = Math.hypot(p.x - player.x, p.y - player.y);
        if (d < p.r + player.r) {
          playSound('powerup');
          vibrate(40);
          if (p.type === 'multi') { powerLevel = 3; powerTimer = 450; }
          if (p.type === 'rapid') { fireRate = 80; powerTimer = 450; }
          if (p.type === 'shield') {
            if (shields < maxShields) shields++;
          }
          createParticles(p.x, p.y, '#00ffcc', 20);
          powerups.splice(i, 1);
          continue;
        }
        if (p.y > H + 40) powerups.splice(i, 1);
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed;

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 6) {
            playSound('hit');
            createParticles(e.x, e.y, e.color, 16);
            score += 20;
            if (Math.random() < 0.15) spawnPowerUp(e.x, e.y);
            enemies.splice(i, 1);
            bullets.splice(j, 1);
            break;
          }
        }

        if (e && Math.hypot(e.x - player.x, e.y - player.y) < e.r + player.r) {
          if (shields > 0) {
            shields--;
            playSound('hit');
            vibrate(120);
            createParticles(player.x, player.y, '#00ffff', 25);
            enemies.splice(i, 1);
          } else {
            gameOver = true;
            playSound('hit');
            vibrate(400);
            createParticles(player.x, player.y, '#ff4444', 35);
          }
          continue;
        }

        if (e && e.y > H + 10) {
          score = Math.max(0, score - 10);
          addFloatingText("-10", e.x, H - 40, '#ff2244');
          enemies.splice(i, 1);
        }
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.02;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.025;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.fillStyle = '#05050d';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#00ffff';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00ffff';
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = '#ff2244';
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#ff2244';
      bossBullets.forEach(bb => {
        ctx.beginPath();
        ctx.arc(bb.x, bb.y, bb.r, 0, Math.PI * 2);
        ctx.fill();
      });

      powerups.forEach(p => {
        ctx.shadowBlur = 15;
        ctx.shadowColor = p.type === 'shield' ? '#00e5ff' : '#ffeb3b';
        ctx.fillStyle = ctx.shadowColor;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.type === 'shield' ? '🛡️' : '⚡', p.x, p.y);
      });

      if (!gameOver && !gameWon) {
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#00e5ff';
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - player.r);
        ctx.lineTo(player.x - player.r, player.y + player.r);
        ctx.lineTo(player.x, player.y + player.r * 0.5);
        ctx.lineTo(player.x + player.r, player.y + player.r);
        ctx.closePath();
        ctx.fill();

        if (shields > 0) {
          ctx.strokeStyle = shields === 3 ? '#ffcc00' : (shields === 2 ? '#00ffcc' : '#00bfff');
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(player.x, player.y, player.r + 12, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      enemies.forEach(e => {
        ctx.shadowBlur = 12;
        ctx.shadowColor = e.color;
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fill();
      });

      if (boss) {
        ctx.shadowBlur = 24;
        ctx.shadowColor = boss.color;
        ctx.fillStyle = boss.color;
        ctx.beginPath();
        ctx.arc(boss.x, boss.y, boss.r, 0, Math.PI * 2);
        ctx.fill();

        const barW = W * 0.75;
        const barH = 12;
        const barX = (W - barW) / 2;
        const barY = 34;

        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.fillRect(barX, barY, barW, barH);

        const hpPercent = Math.max(0, boss.hp / boss.maxHp);
        ctx.fillStyle = boss.color;
        ctx.fillRect(barX, barY, barW * hpPercent, barH);
        
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(boss.name, W / 2, barY - 6);
      }

      if (bossWarningTimer > 0) {
        bossWarningTimer--;
        ctx.fillStyle = '#ff0055';
        ctx.font = 'bold 22px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⚠️ WARNING: BOSS INCOMING! ⚠️', W / 2, H / 2 - 50);
      }

      floatingTexts.forEach(ft => {
        ctx.globalAlpha = ft.alpha;
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
      });
      ctx.globalAlpha = 1;

      particles.forEach(p => {
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`Score: ${score}`, 20, 42);

      ctx.textAlign = 'right';
      let shieldIcons = '';
      for (let i = 0; i < shields; i++) shieldIcons += '🛡️ ';
      ctx.font = '16px sans-serif';
      ctx.fillText(shieldIcons.trim() || 'NO SHIELD', W - 20, 42);

      if (powerTimer > 0) {
        ctx.fillStyle = '#ffeb3b';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`Boost: ${Math.ceil(powerTimer / 60)}s`, 20, 68);
      }
    }

    function loop(time) {
      update(time);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
